name: Public Site Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "functions/api/animals.ts"
      - "functions/api/content.ts"
      - "assets/js/rescue-animals.js"
      - "assets/js/cms.js"
      - "*.html"
      - ".github/workflows/public-site-checks.yml"
  push:
    branches: [main]
    paths:
      - "functions/api/animals.ts"
      - "assets/js/rescue-animals.js"
      - "rescue.html"
      - "adopt.html"
      - ".github/workflows/public-site-checks.yml"

permissions:
  contents: read

jobs:
  public-animal-feed:
    name: Validate public adoption and rescue feed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public website JavaScript syntax
        run: |
          node --check assets/js/rescue-animals.js
          node --check assets/js/cms.js
      - name: Type-check the read-only animal feed function
        run: npx --yes --package typescript tsc --noEmit --target ES2022 --module ESNext --lib ES2022,DOM functions/api/animals.ts functions/api/content.ts
      - name: Verify both public animal pages consume the API
        run: |
          node <<'NODE'
          const fs = require('fs');
          const adopt = fs.readFileSync('adopt.html', 'utf8');
          const rescue = fs.readFileSync('rescue.html', 'utf8');
          if (!adopt.includes('/api/animals')) throw new Error('Adoption page is not connected to /api/animals');
          if (!rescue.includes('assets/js/rescue-animals.js') || !rescue.includes('id="rescue-animals-grid"')) throw new Error('Rescue page is missing the live animal feed');
          for (const page of ['index.html', 'about.html', 'adopt.html', 'contact.html', 'donate.html', 'gallery.html', 'rescue.html', 'volunteer.html']) {
            if (!fs.readFileSync(page, 'utf8').includes('assets/js/cms.js')) throw new Error(page + ' is missing the public CMS renderer');
          }
          console.log('Public animal feeds and CMS renderer are connected on all public pages.');
          NODE
