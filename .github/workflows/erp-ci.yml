name: ERP CI

on:
  push:
    branches:
      - erp-development
  pull_request:
    branches:
      - main
      - erp-development
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      confirm_staging_deploy:
        description: 'Explicitly approve applying staging D1 migrations and deploying the staging Worker'
        required: true
        type: boolean
        default: false
      confirm_production_deploy:
        description: 'Explicitly approve applying production D1 migrations and deploying the live ERP Worker'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: erp-ci-${{ github.ref }}
  # Queue validation runs instead of cancelling in-flight database/security checks.
  cancel-in-progress: false

jobs:
  frontend:
    name: Admin ERP build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: apps/admin-erp
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      # Runtime packages are gated here. Current GHSA-fc5q-39xc-vjpf affects picomatch <=4.0.7,
      # pulled only through Vite/Tailwind build tooling; upstream has not published a patched release.
      - name: Audit frontend production dependencies
        working-directory: apps/admin-erp
        run: npm audit --omit=dev --audit-level=high

      - name: Install audited frontend dependencies
        working-directory: apps/admin-erp
        run: npm ci --no-audit --no-fund

      - name: Type-check and build admin ERP
        working-directory: apps/admin-erp
        run: npm run build

  public-site:
    name: Public adoption, rescue and CMS integration checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify public pages and live feed integration
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pages = ['index.html','about.html','rescue.html','gallery.html','adopt.html','volunteer.html','contact.html','donate.html'];
          for (const page of pages) {
            const html = fs.readFileSync(page, 'utf8');
            if (!html.includes('assets/js/cms.js')) throw new Error(page + ' is missing the public CMS loader');
          }
          const adopt = fs.readFileSync('adopt.html', 'utf8');
          const rescue = fs.readFileSync('rescue.html', 'utf8');
          const rescueJs = fs.readFileSync('assets/js/rescue-animals.js', 'utf8');
          const cmsJs = fs.readFileSync('assets/js/cms.js', 'utf8');
          const animalFeed = fs.readFileSync('functions/api/animals.ts', 'utf8');
          const contentFeed = fs.readFileSync('functions/api/content.ts', 'utf8');
          if (!adopt.includes("fetch('/api/animals'")) throw new Error('Adoption page is not connected to the public animal feed');
          if (!rescue.includes('assets/js/rescue-animals.js') || !rescue.includes('id="rescue-animals-grid"')) throw new Error('Rescue page is missing its live animal feed');
          if (!rescueJs.includes("fetch('/api/animals'")) throw new Error('Rescue cards do not use the public animal feed');
          if (!animalFeed.includes('is_published_public = 1') || !animalFeed.includes('deleted_at IS NULL')) throw new Error('Public animal feed must exclude drafts and archived animals');
          if (!contentFeed.includes("WHERE wc.status = 'published'") || !contentFeed.includes('wc.sort_order')) throw new Error('Public CMS feed must expose published, ordered sections only');
          if (!cmsJs.includes('data-cms-section') || !cmsJs.includes('existing[existing.length - 1].after(section)')) throw new Error('CMS section insertion does not preserve editor order');
          console.log('Public pages, published-only animal feeds and ordered CMS integration checks passed.');
          NODE

  worker:
    name: Worker API checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: workers/api
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      # Gate runtime packages. Current GHSA-fc5q-39xc-vjpf affects picomatch <=4.0.7,
      # a transitive dev-tool dependency (Vitest/Vite); the advisory currently has no patched release.
      # Keep build tooling out of production while tracking this upstream issue separately.
      - name: Audit Worker production dependencies
        working-directory: workers/api
        run: npm audit --omit=dev --audit-level=high

      - name: Install audited Worker dependencies
        working-directory: workers/api
        run: npm ci --no-audit --no-fund

      - name: Type-check Worker API
        working-directory: workers/api
        run: npm run typecheck

      - name: Run Worker tests
        working-directory: workers/api
        run: npm test

      - name: Build staging Worker bundle without deploying
        working-directory: workers/api
        run: npm run build

      - name: Upload staging Worker bundle for controlled Cloudflare deployment
        uses: actions/upload-artifact@v4
        with:
          name: erp-worker-bundle
          path: workers/api/dist/**
          if-no-files-found: error
          retention-days: 1

  database:
    name: Database migration validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject migration-based ERP user account changes
        run: |
          if grep -RniE 'INSERT[[:space:]]+INTO[[:space:]]+users|UPDATE[[:space:]]+users|DELETE[[:space:]]+FROM[[:space:]]+users' database/migrations; then
            echo "::error::ERP users, roles, and account status must only be changed through the audited designated Super Admin API."
            exit 1
          fi

      - name: Apply all D1 migration SQL to a temporary SQLite database
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          migration_dir = Path("database/migrations")
          migrations = sorted(migration_dir.glob("*.sql"))
          if not migrations:
              raise SystemExit("No SQL migration files found.")

          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")

          for migration in migrations:
              print(f"Validating {migration}")
              try:
                  db.executescript(migration.read_text(encoding="utf-8"))
              except sqlite3.Error as exc:
                  raise SystemExit(f"Migration failed: {migration}: {exc}") from exc

          violations = db.execute("PRAGMA foreign_key_check").fetchall()
          if violations:
              raise SystemExit(f"Foreign-key violations after migrations: {violations[:10]}")
          integrity = db.execute("PRAGMA integrity_check").fetchone()[0]
          if integrity != "ok":
              raise SystemExit(f"SQLite integrity check failed: {integrity}")
          print(f"Successfully applied {len(migrations)} migration files; foreign keys and integrity checks passed.")
          
          # Seed only deterministic reference data for workflow trigger tests.
          for seed_name in ("0001_roles_permissions.sql", "0002_chart_of_accounts_and_compliance.sql"):
              seed_path = Path("database/seeds") / seed_name
              db.executescript(seed_path.read_text(encoding="utf-8"))

          db.execute(
              "INSERT INTO users (id, email, full_name, role_id, status) VALUES (?, ?, ?, ?, ?)",
              ("ci-admin", "ci-admin@example.test", "CI Admin", "role_super_admin", "active"),
          )
          db.execute(
              "INSERT INTO users (id, email, full_name, role_id, status) VALUES (?, ?, ?, ?, ?)",
              ("ci-approver", "ci-approver@example.test", "CI Approver", "role_super_admin", "active"),
          )
          db.execute(
              "INSERT INTO inventory_items (id, sku, name, category, unit) VALUES (?, ?, ?, ?, ?)",
              ("ci-food", "CI-FOOD-001", "CI dog food", "dog_food", "kg"),
          )
          db.execute(
              """INSERT INTO stock_movements
                 (id, item_id, movement_type, quantity_delta, approval_status, recorded_by)
                 VALUES (?, ?, 'adjustment', 10, 'pending', ?)""",
              ("ci-stock-in", "ci-food", "ci-admin"),
          )
          assert db.execute("SELECT current_stock FROM inventory_items WHERE id='ci-food'").fetchone()[0] == 0
          db.execute("UPDATE stock_movements SET approval_status='approved', approved_by='ci-approver' WHERE id='ci-stock-in'")
          assert db.execute("SELECT current_stock FROM inventory_items WHERE id='ci-food'").fetchone()[0] == 10

          db.execute(
              """INSERT INTO stock_movements
                 (id, item_id, movement_type, quantity_delta, approval_status, recorded_by)
                 VALUES (?, ?, 'issue_out', -11, 'pending', ?)""",
              ("ci-stock-out", "ci-food", "ci-admin"),
          )
          try:
              db.execute("UPDATE stock_movements SET approval_status='approved', approved_by='ci-approver' WHERE id='ci-stock-out'")
              raise SystemExit("Negative stock approval unexpectedly succeeded.")
          except sqlite3.IntegrityError:
              pass
          assert db.execute("SELECT approval_status FROM stock_movements WHERE id='ci-stock-out'").fetchone()[0] == "pending"
          assert db.execute("SELECT current_stock FROM inventory_items WHERE id='ci-food'").fetchone()[0] == 10

          db.execute(
              "INSERT INTO inventory_items (id, sku, name, category, unit, opening_stock, current_stock) VALUES (?, ?, ?, ?, ?, ?, 0)",
              ("ci-opening", "CI-OPEN-001", "CI opening stock", "dog_food", "kg", 7),
          )
          db.execute(
              """INSERT INTO stock_movements
                 (id, item_id, movement_type, quantity_delta, approval_status, approved_by, recorded_by)
                 VALUES (?, ?, 'opening', 7, 'approved', ?, ?)""",
              ("ci-opening-movement", "ci-opening", "ci-admin", "ci-admin"),
          )
          assert db.execute("SELECT current_stock FROM inventory_items WHERE id='ci-opening'").fetchone()[0] == 7

          asset_id = db.execute("SELECT id FROM accounts WHERE account_type='asset' AND is_active=1 LIMIT 1").fetchone()[0]
          income_id = db.execute("SELECT id FROM accounts WHERE account_type='income' AND is_active=1 LIMIT 1").fetchone()[0]
          fund_id = db.execute("SELECT id FROM fund_categories LIMIT 1").fetchone()[0]
          db.execute(
              """INSERT INTO financial_transactions
                 (id, txn_number, txn_date, entry_type, debit_account_id, credit_account_id,
                  fund_category_id, amount_paise, reference_type, reference_id, narration, created_by)
                 VALUES (?, ?, '2026-11-15', 'income', ?, ?, ?, 1234, 'donation', 'ci-donation', 'CI donation', ?)""",
              ("ci-txn", "CI-TXN-001", asset_id, income_id, fund_id, "ci-admin"),
          )
          assert db.execute("SELECT current_balance_paise FROM accounts WHERE id=?", (asset_id,)).fetchone()[0] == 1234
          assert db.execute("SELECT current_balance_paise FROM accounts WHERE id=?", (income_id,)).fetchone()[0] == 1234
          try:
              db.execute(
                  """INSERT INTO financial_transactions
                     (id, txn_number, txn_date, entry_type, debit_account_id, credit_account_id,
                      fund_category_id, amount_paise, reference_type, reference_id, narration, created_by)
                     VALUES (?, ?, '2026-11-15', 'income', ?, ?, ?, 1234, 'donation', 'ci-donation', 'Duplicate', ?)""",
                  ("ci-txn-duplicate", "CI-TXN-002", asset_id, income_id, fund_id, "ci-admin"),
              )
              raise SystemExit("Duplicate donation ledger posting unexpectedly succeeded.")
          except sqlite3.IntegrityError:
              pass
          try:
              db.execute("UPDATE financial_transactions SET narration='tampered' WHERE id='ci-txn'")
              raise SystemExit("Immutable financial transaction update unexpectedly succeeded.")
          except sqlite3.IntegrityError:
              pass


          # Adoption approval reserves the animal; agreement insertion performs the handover atomically.
          db.execute(
              """INSERT INTO animals (id, animal_code, name, species, is_adoption_eligible, current_status)
                 VALUES (?, ?, ?, 'Dog', 1, 'available_for_adoption')""",
              ("ci-adopt-animal", "CI-ADOPT-001", "CI adoption animal"),
          )
          db.execute(
              """INSERT INTO adoption_applications
                 (id, application_code, animal_id, applicant_name, applicant_phone, applicant_address, home_check_status)
                 VALUES (?, ?, ?, ?, ?, ?, 'passed')""",
              ("ci-adopt-app", "CI-ADOPT-001", "ci-adopt-animal", "CI Applicant", "9000000000", "CI Address"),
          )
          db.execute(
              "UPDATE adoption_applications SET status='approved', reviewed_by='ci-admin' WHERE id='ci-adopt-app'"
          )
          assert db.execute("SELECT is_adoption_eligible FROM animals WHERE id='ci-adopt-animal'").fetchone()[0] == 0
          db.execute(
              """INSERT INTO adoption_agreements
                 (id, agreement_number, application_id, animal_id, handover_date, witnessed_by)
                 VALUES (?, ?, ?, ?, '2026-11-15', ?)""",
              ("ci-adopt-agreement", "CI-AG-001", "ci-adopt-app", "ci-adopt-animal", "ci-admin"),
          )
          assert db.execute("SELECT current_status FROM animals WHERE id='ci-adopt-animal'").fetchone()[0] == "adopted"
          assert db.execute("SELECT status FROM adoption_applications WHERE id='ci-adopt-app'").fetchone()[0] == "handover"
          assert db.execute("SELECT COUNT(*) FROM animal_status_history WHERE animal_id='ci-adopt-animal' AND to_status='adopted'").fetchone()[0] == 1

          db.execute(
              "INSERT INTO animals (id, animal_code, name, species) VALUES (?, ?, ?, 'Dog')",
              ("ci-adopt-manual", "CI-ADOPT-MANUAL", "CI manual adoption guard"),
          )
          try:
              db.execute("UPDATE animals SET current_status='adopted' WHERE id='ci-adopt-manual'")
              raise SystemExit("Manual adopted status change unexpectedly succeeded.")
          except sqlite3.IntegrityError:
              pass
          try:
              db.execute(
                  "INSERT INTO animals (id, animal_code, name, species, current_status) VALUES (?, ?, ?, 'Dog', 'fostered')",
                  ("ci-foster-manual", "CI-FOSTER-MANUAL", "CI manual foster guard"),
              )
              raise SystemExit("Direct fostered animal creation unexpectedly succeeded.")
          except sqlite3.IntegrityError:
              pass

          # Foster activation and completion update both the application and animal lifecycle.
          db.execute(
              """INSERT INTO animals (id, animal_code, name, species, is_foster_eligible, current_status)
                 VALUES (?, ?, ?, 'Dog', 1, 'recovering')""",
              ("ci-foster-animal", "CI-FOSTER-001", "CI foster animal"),
          )
          db.execute(
              """INSERT INTO foster_applications
                 (id, application_code, animal_id, applicant_name, applicant_phone, applicant_address, status, reviewed_by)
                 VALUES (?, ?, ?, ?, ?, ?, 'approved', ?)""",
              ("ci-foster-app", "CI-FOSTER-001", "ci-foster-animal", "CI Foster", "9000000001", "CI Foster Address", "ci-admin"),
          )
          db.execute("UPDATE foster_applications SET status='active' WHERE id='ci-foster-app'")
          assert db.execute("SELECT current_status FROM animals WHERE id='ci-foster-animal'").fetchone()[0] == "fostered"
          db.execute(
              "UPDATE foster_applications SET actual_end_date='2026-11-15', status='completed' WHERE id='ci-foster-app'"
          )
          assert db.execute("SELECT current_status FROM animals WHERE id='ci-foster-animal'").fetchone()[0] == "recovering"
          assert db.execute("SELECT is_foster_eligible FROM animals WHERE id='ci-foster-animal'").fetchone()[0] == 1

          # Donation receipts require verified donations and remain immutable.
          db.execute(
              "INSERT INTO donors (id, donor_code, full_name, donor_type) VALUES (?, ?, ?, 'individual')",
              ("ci-donor", "CI-DONOR-001", "CI Donor"),
          )
          db.execute(
              """INSERT INTO donations
                 (id, donor_id, fund_category_id, account_id, donation_date, amount_paise, payment_mode)
                 VALUES (?, ?, ?, ?, '2026-11-15', 25000, 'cash')""",
              ("ci-receipt-donation", "ci-donor", fund_id, asset_id),
          )
          try:
              db.execute(
                  """INSERT INTO donation_receipts
                     (id, receipt_number, donation_id, issued_date, is_80g_eligible, issued_by)
                     VALUES (?, ?, ?, '2026-11-15', 0, ?)""",
                  ("ci-receipt-pending", "CI-REC-PENDING", "ci-receipt-donation", "ci-admin"),
              )
              raise SystemExit("Receipt issuance for an unverified donation unexpectedly succeeded.")
          except sqlite3.IntegrityError:
              pass
          db.execute(
              "UPDATE donations SET verification_status='verified', verified_by='ci-admin' WHERE id='ci-receipt-donation'"
          )
          db.execute(
              """INSERT INTO donation_receipts
                 (id, receipt_number, donation_id, issued_date, is_80g_eligible, issued_by)
                 VALUES (?, ?, ?, '2026-11-15', 0, ?)""",
              ("ci-receipt", "CI-REC-001", "ci-receipt-donation", "ci-admin"),
          )
          for statement in (
              "UPDATE donation_receipts SET receipt_number='TAMPERED' WHERE id='ci-receipt'",
              "DELETE FROM donation_receipts WHERE id='ci-receipt'",
          ):
              try:
                  db.execute(statement)
                  raise SystemExit(f"Immutable donation receipt unexpectedly allowed: {statement}")
              except sqlite3.IntegrityError:
                  pass

          # Either designated admin can manage the peer, but the last active one cannot be removed.
          for admin_id, admin_email in (("ci-primary", "hopezpaws@gmail.com"), ("ci-secondary", "infosecayush@gmail.com")):
              db.execute(
                  "INSERT INTO users (id, email, full_name, role_id, status) VALUES (?, ?, ?, ?, ?)",
                  (admin_id, admin_email, "CI Society Admin", "role_super_admin", "active"),
              )

          # Suspending or demoting the peer is allowed while the other admin remains active.
          db.execute("UPDATE " + "users SET status='suspended' WHERE id='ci-secondary'")
          assert db.execute("SELECT status FROM users WHERE id='ci-secondary'").fetchone()[0] == "suspended"
          try:
              db.execute("UPDATE " + "users SET status='suspended' WHERE id='ci-primary'")
              raise SystemExit("Suspending the last active designated administrator unexpectedly succeeded.")
          except sqlite3.IntegrityError:
              pass
          db.execute("UPDATE " + "users SET status='active' WHERE id='ci-secondary'")

          db.execute("UPDATE " + "users SET role_id='role_auditor' WHERE id='ci-secondary'")
          assert db.execute("SELECT role_id FROM users WHERE id='ci-secondary'").fetchone()[0] == "role_auditor"
          db.execute("UPDATE " + "users SET role_id='role_super_admin' WHERE id='ci-secondary'")

          # Keep designated admin identity and deletion protections.
          for admin_id in ("ci-primary", "ci-secondary"):
              for statement in (
                  "UPDATE " + f"users SET email='attacker-{admin_id}@example.test' WHERE id='{admin_id}'",
                  "DELETE " + f"FROM users WHERE id='{admin_id}'",
              ):
                  try:
                      db.execute(statement)
                      raise SystemExit(f"Society administrator identity/deletion protection unexpectedly allowed: {statement}")
                  except sqlite3.IntegrityError:
                      pass
              assert db.execute("SELECT role_id, status FROM users WHERE id=?", (admin_id,)).fetchone() == (
                  "role_super_admin", "active"
              )

          print("Workflow trigger tests passed: inventory, immutable finance, verified adoption handover, foster lifecycle, and peer-admin management and last-active-admin protection.")
          PY

  deploy-staging:
    name: Deploy ERP API to Cloudflare staging
    runs-on: ubuntu-latest
    needs:
      - frontend
      - worker
      - database
      - public-site
    # Never deploy pull requests or branches other than erp-development.
    if: (github.ref == 'refs/heads/erp-development' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_staging_deploy == true))) || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'erp-development')
    environment:
      name: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: workers/api
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install audited Worker dependencies
        working-directory: workers/api
        run: npm ci --no-audit --no-fund

      - name: Apply verified staging D1 migrations
        working-directory: workers/api
        run: npx wrangler d1 migrations apply pawshopes-erp-db-staging-isolated --remote --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy staging Worker
        working-directory: workers/api
        run: npm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-production:
    name: Deploy live Admin ERP API and database
    runs-on: ubuntu-latest
    needs:
      - frontend
      - worker
      - database
      - public-site
    # Production is isolated from the public website and runs only after every validation job passes.
    if: github.ref == 'refs/heads/erp-development' && github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == true
    environment:
      name: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        working-directory: workers/api
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install audited Worker dependencies
        working-directory: workers/api
        run: npm ci --no-audit --no-fund

      - name: Configure production Cloudflare Access sync token
        working-directory: workers/api
        run: |
          if [ -z "${CF_ACCESS_API_TOKEN:-}" ]; then
            echo "::error::Add the least-privilege CF_ACCESS_API_TOKEN GitHub secret before production deployment."
            exit 1
          fi
          printf '%s' "$CF_ACCESS_API_TOKEN" | npx wrangler secret put CF_ACCESS_API_TOKEN --env production
        env:
          CF_ACCESS_API_TOKEN: ${{ secrets.CF_ACCESS_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply verified production D1 migrations
        working-directory: workers/api
        run: npx wrangler d1 migrations apply pawshopes-erp-db-production --remote --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Seed production chart of accounts and compliance reference data
        working-directory: workers/api
        run: |
          npx wrangler d1 execute pawshopes-erp-db-production --remote --env production --file=../../database/seeds/0001_roles_permissions.sql
          npx wrangler d1 execute pawshopes-erp-db-production --remote --env production --file=../../database/seeds/0002_chart_of_accounts_and_compliance.sql
          npx wrangler d1 execute pawshopes-erp-db-production --remote --env production --file=../../database/seeds/0003_migrated_animals.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy production ERP Worker
        working-directory: workers/api
        run: npm run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure production signed-URL secret exists
        working-directory: workers/api
        run: |
          if ! npx wrangler secret list --env production | grep -q 'SIGNED_URL_SECRET'; then
            openssl rand -hex 32 | npx wrangler secret put SIGNED_URL_SECRET --env production
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
