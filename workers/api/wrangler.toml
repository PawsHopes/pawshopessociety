name = "pawshopes-erp-api"
main = "src/index.ts"
compatibility_date = "2026-11-15"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
PUBLIC_SITE_ORIGIN = "https://pawshopessociety.pages.dev"
ADMIN_ERP_ORIGIN = "https://phs-phs.pages.dev"
CF_ACCESS_TEAM_DOMAIN = "mute-pond-e3e6.cloudflareaccess.com"
CF_ACCESS_AUD = "b941a22f6158aabe38e0222476b9b30cd93142f559ef20efb7e9cd4d8945d228"
STAGING_BOOTSTRAP_ADMIN_EMAIL = "hopezpaws@gmail.com"
PUBLIC_MEDIA_BASE_URL = "https://media-staging.pawshopessociety.org"

[[d1_databases]]
binding = "DB"
database_name = "pawshopes-erp-db-staging"
database_id = "a6fd7136-b618-4072-af6a-5373f4e727d1"
migrations_dir = "../../database/migrations"

[[r2_buckets]]
binding = "PUBLIC_MEDIA"
bucket_name = "pawshopes-public-media-staging"

[[r2_buckets]]
binding = "PRIVATE_VAULT"
bucket_name = "pawshopes-private-vault-staging"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "1156cf04f6b9496dabc7d580457f0c53"

[triggers]
crons = ["30 2 * * *"]

[env.staging]
name = "pawshopes-erp-api-staging"
vars = { ENVIRONMENT = "staging", PUBLIC_SITE_ORIGIN = "https://pawshopessociety.pages.dev", ADMIN_ERP_ORIGIN = "https://phs-phs.pages.dev", CF_ACCESS_TEAM_DOMAIN = "mute-pond-e3e6.cloudflareaccess.com", CF_ACCESS_AUD = "b941a22f6158aabe38e0222476b9b30cd93142f559ef20efb7e9cd4d8945d228", STAGING_BOOTSTRAP_ADMIN_EMAIL = "hopezpaws@gmail.com", PUBLIC_MEDIA_BASE_URL = "https://media-staging.pawshopessociety.org" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "pawshopes-erp-db-staging"
database_id = "a6fd7136-b618-4072-af6a-5373f4e727d1"
migrations_dir = "../../database/migrations"

[[env.staging.r2_buckets]]
binding = "PUBLIC_MEDIA"
bucket_name = "pawshopes-public-media-staging"

[[env.staging.r2_buckets]]
binding = "PRIVATE_VAULT"
bucket_name = "pawshopes-private-vault-staging"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "1156cf04f6b9496dabc7d580457f0c53"

[env.staging.triggers]
crons = ["30 2 * * *"]
