name = "pawshopes-erp-api"
main = "src/index.ts"
compatibility_date = "2026-11-15"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
PUBLIC_SITE_ORIGIN = "https://pawshopessociety.pages.dev"
ADMIN_ERP_ORIGIN = "https://phs-phs.pages.dev"
CF_ACCESS_TEAM_DOMAIN = "mute-pond-e3e6.cloudflareaccess.com"
CF_ACCESS_AUD = "b93203823e0d4aae22bc961e5d9d1451ca38605e48d788b4bddccdc7c5418316"
STAGING_BOOTSTRAP_ADMIN_EMAIL = "hopezpaws@gmail.com"
PUBLIC_MEDIA_BASE_URL = "https://pub-3819e5d7af12440f8b190b69723b4dc4.r2.dev"

[[d1_databases]]
binding = "DB"
database_name = "pawshopes-erp-db-development"
database_id = "93b67f22-db38-4fdc-95ab-16a41e5492f7"
migrations_dir = "../../database/migrations"
migrations_table = "d1_migrations"

[[r2_buckets]]
binding = "PUBLIC_MEDIA"
bucket_name = "pawshopes-public-media-staging"

[[r2_buckets]]
binding = "PRIVATE_VAULT"
bucket_name = "pawshopes-private-vault-staging"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "1156cf04f6b9496dabc7d580457f0c53"

[triggers]
crons = ["30 2 * * *"]

[env.staging]
name = "pawshopes-erp-api-staging"
vars = { ENVIRONMENT = "staging", PUBLIC_SITE_ORIGIN = "https://pawshopessociety.pages.dev", ADMIN_ERP_ORIGIN = "https://phs-phs.pages.dev", CF_ACCESS_TEAM_DOMAIN = "mute-pond-e3e6.cloudflareaccess.com", CF_ACCESS_AUD = "b93203823e0d4aae22bc961e5d9d1451ca38605e48d788b4bddccdc7c5418316", STAGING_BOOTSTRAP_ADMIN_EMAIL = "hopezpaws@gmail.com", PUBLIC_MEDIA_BASE_URL = "https://pub-3819e5d7af12440f8b190b69723b4dc4.r2.dev" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "pawshopes-erp-db-development"
database_id = "93b67f22-db38-4fdc-95ab-16a41e5492f7"
migrations_dir = "../../database/migrations"
migrations_table = "d1_migrations"

[[env.staging.r2_buckets]]
binding = "PUBLIC_MEDIA"
bucket_name = "pawshopes-public-media-staging"

[[env.staging.r2_buckets]]
binding = "PRIVATE_VAULT"
bucket_name = "pawshopes-private-vault-staging"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "1156cf04f6b9496dabc7d580457f0c53"

[env.staging.triggers]
crons = ["30 2 * * *"]


[env.production]
name = "pawshopes-erp-api"
vars = { ENVIRONMENT = "production", PUBLIC_SITE_ORIGIN = "https://pawshopessociety.pages.dev", ADMIN_ERP_ORIGIN = "https://pha-phs.pages.dev", CF_ACCESS_TEAM_DOMAIN = "mute-pond-e3e6.cloudflareaccess.com", CF_ACCESS_AUD = "0fc8affe178933ffab2c4023015001041b3c90fd5fa1be69b02a6d431f5bfec4", PUBLIC_MEDIA_BASE_URL = "https://pub-930db665dcf54737a53feabe1e917c47.r2.dev" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "pawshopes-erp-db-production"
database_id = "0289e903-7811-449f-b3a3-be156bc5f49b"
migrations_dir = "../../database/migrations"
migrations_table = "d1_migrations"

[[env.production.r2_buckets]]
binding = "PUBLIC_MEDIA"
bucket_name = "pawshopes-public-media-production"

[[env.production.r2_buckets]]
binding = "PRIVATE_VAULT"
bucket_name = "pawshopes-private-vault-production"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "f070ac206422491fb3cdd58f7ff720fa"

[env.production.triggers]
crons = ["*/15 * * * *"]
