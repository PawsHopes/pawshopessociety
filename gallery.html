<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shelter Gallery & Animal Photo Preview | Paws Hopes Society</title>
  <meta name="description" content="View authentic photos of dogs, cats, birds, monkeys, squirrels, guinea pigs and reptiles cared for at Paws Hopes Society shelter in Lucknow.">
  <link rel="canonical" href="https://pawshopessociety.org/gallery.html">

  <meta property="og:title" content="Shelter Photo Gallery | Paws Hopes Society">
  <meta property="og:description" content="Explore real shelter animals living safely at our Bakshi Ka Talab sanctuary.">
  <meta property="og:url" content="https://pawshopessociety.org/gallery.html">
  <meta property="og:image" content="https://pawshopessociety.org/assets/images/hero.jpg">

  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-warm-white text-slate-800 transition-colors duration-300">

  <div id="scroll-progress" aria-hidden="true"></div>

  <!-- Header -->
  <header id="site-header" class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md text-white border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <img src="assets/images/logo.png" alt="Logo" class="h-12 w-12 rounded-full border-2 border-brand-orange" width="48" height="48">
        <span class="text-xl font-bold">Paws Hopes Society</span>
      </a>
      <nav class="hidden lg:flex items-center gap-7 font-semibold text-sm">
        <a href="index.html" class="hover:text-brand-orange">Home</a>
        <a href="about.html" class="hover:text-brand-orange">About</a>
        <a href="rescue.html" class="hover:text-brand-orange">Rescue</a>
        <a href="gallery.html" class="text-brand-orange" aria-current="page">Gallery</a>
        <a href="volunteer.html" class="hover:text-brand-orange">Volunteer</a>
        <a href="donate.html" class="hover:text-brand-orange">Donate</a>
        <a href="contact.html" class="hover:text-brand-orange">Contact</a>
      </nav>
      <a href="donate.html" class="hidden lg:inline-block bg-brand-orange text-white font-bold px-6 py-2.5 rounded-full">Donate</a>
    </div>
  </header>

  <main>
    <section class="py-16 bg-slate-950 text-white text-center">
      <div class="max-w-4xl mx-auto px-4">
        <h1 class="text-4xl font-extrabold">Shelter & Rescue Photo Gallery</h1>
        <p class="text-slate-300 mt-3">Click on any photo to open a high-resolution lightbox preview.</p>
      </div>
    </section>

    <!-- Category Filter Controls -->
    <section class="py-8 bg-slate-100 dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800">
      <div class="max-w-7xl mx-auto px-4 flex flex-wrap justify-center gap-3 text-xs sm:text-sm font-bold">
        <button class="gallery-filter-btn active px-4 py-2 rounded-full bg-brand-orange text-white" data-filter="all">All Species</button>
        <button class="gallery-filter-btn px-4 py-2 rounded-full bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-brand-orange hover:text-white transition-colors" data-filter="dogs">Dogs & Puppies</button>
        <button class="gallery-filter-btn px-4 py-2 rounded-full bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-brand-orange hover:text-white transition-colors" data-filter="cats">Cats & Kittens</button>
        <button class="gallery-filter-btn px-4 py-2 rounded-full bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-brand-orange hover:text-white transition-colors" data-filter="wildlife">Monkeys, Birds & Reptiles</button>
      </div>
    </section>

    <!-- Masonry Photo Grid -->
    <section class="py-16 bg-warm-white dark:bg-slate-900">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          
          <div class="gallery-item group relative rounded-3xl overflow-hidden cursor-pointer shadow-md bg-slate-100 dark:bg-slate-800" data-category="dogs" data-src="assets/images/hero.jpg" data-caption="Recovered rescue dog enjoying shelter grounds">
            <img src="assets/images/hero.jpg" alt="Rescue dog enjoying sanctuary" class="w-full h-72 object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy" width="400" height="288">
            <div class="absolute inset-0 bg-slate-950/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-center p-4">
              <div>
                <i class="fas fa-search-plus fa-2x mb-2 text-brand-orange" aria-hidden="true"></i>
                <p class="font-bold">Rescue Dog At Bakshi Ka Talab</p>
              </div>
            </div>
          </div>

          <div class="gallery-item group relative rounded-3xl overflow-hidden cursor-pointer shadow-md bg-slate-100 dark:bg-slate-800" data-category="dogs" data-src="assets/images/rescue1.jpg" data-caption="Volunteer giving affection to rescued puppy">
            <img src="assets/images/rescue1.jpg" alt="Volunteer with rescued puppy" class="w-full h-72 object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy" width="400" height="288">
            <div class="absolute inset-0 bg-slate-950/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-center p-4">
              <div>
                <i class="fas fa-search-plus fa-2x mb-2 text-brand-orange" aria-hidden="true"></i>
                <p class="font-bold">Affection & Daily Care</p>
              </div>
            </div>
          </div>

          <div class="gallery-item group relative rounded-3xl overflow-hidden cursor-pointer shadow-md bg-slate-100 dark:bg-slate-800" data-category="wildlife" data-src="assets/images/rescue2.jpg" data-caption="Medical examination room at shelter">
            <img src="assets/images/rescue2.jpg" alt="Medical room examination" class="w-full h-72 object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy" width="400" height="288">
            <div class="absolute inset-0 bg-slate-950/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-center p-4">
              <div>
                <i class="fas fa-search-plus fa-2x mb-2 text-brand-orange" aria-hidden="true"></i>
                <p class="font-bold">Shelter OPD Clinic</p>
              </div>
            </div>
          </div>

        </div>

      </div>
    </section>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 z-50 bg-slate-950/95 hidden items-center justify-center p-4">
      <button id="lightbox-close" class="absolute top-6 right-6 text-white text-3xl hover:text-brand-orange transition-colors" aria-label="Close Lightbox Modal">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
      <div class="max-w-4xl max-h-[85vh] text-center">
        <img id="lightbox-img" src="" alt="Enlarged shelter photo view" class="max-h-[75vh] mx-auto rounded-2xl shadow-2xl object-contain">
        <p id="lightbox-caption" class="text-white font-semibold mt-4 text-base sm:text-lg"></p>
      </div>
    </div>
  </main>

  <footer class="bg-slate-950 text-slate-400 py-8 border-t border-slate-800 text-center text-xs">
    <p>© 2026 Paws Hopes Society. All Rights Reserved.</p>
  </footer>

  <script src="assets/js/script.js"></script>
</body>
</html>
